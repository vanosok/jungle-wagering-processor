services:
  app:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ['--config.file=/etc/prometheus/prometheus.yaml', '--storage.tsdb.retention.time=24h']
    volumes: ['./ops/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro']
    ports: ['127.0.0.1:9090:9090']
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports: ['127.0.0.1:16686:16686', '127.0.0.1:4318:4318']
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-grafana
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3300:3000']
    depends_on: [prometheus, jaeger]
