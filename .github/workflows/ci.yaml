name: Verify financial guarantees
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: docker compose up -d --wait postgres localstack
      - run: bun run test:all
      - name: Start optional observability stack
        run: docker compose -f compose.yaml -f compose.observability.yaml up -d --build --scale app=3 --wait
      - name: Verify dashboard, replica discovery and distributed traces
        run: |
          export API_URL="http://$(docker compose port --index 1 app 3000)"
          bun run observability:verify
          bun run test:load --urls="$API_URL" --requests=100 --concurrency=6 --wallets=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-smoke-report
          path: benchmarks/distributed-100-6.json
          if-no-files-found: ignore
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.observability.yaml logs --tail 100
      - name: Stop infrastructure
        if: always()
        run: docker compose -f compose.yaml -f compose.observability.yaml down
